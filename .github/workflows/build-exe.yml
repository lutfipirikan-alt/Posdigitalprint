name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Create Electron Entry Script
        run: |
          New-Item -ItemType Directory -Force -Path electron
          @'
          const { app, BrowserWindow } = require('electron');
          const path = require('path');
          
          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 800,
              minWidth: 1024,
              minHeight: 600,
              title: "POS Digital Print",
              autoHideMenuBar: true,
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true
              }
            });
            win.loadFile(path.join(__dirname, 'dist', 'index.html'));
          }
          
          app.whenReady().then(createWindow);
          
          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          '@ | Out-File -FilePath electron/main.js -Encoding utf8

      - name: Install Electron & Compile .EXE
        run: |
          npm install --save-dev electron@latest electron-builder@latest
          npx electron-builder --win nsis portable --x64 -c.extraMetadata.main=electron/main.js -c.directories.output=dist-electron -c.files="dist/**/*","electron/**/*"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: POS-Digital-Print-Windows-EXE
          path: dist-electron/*.exe
          if-no-files-found: error
