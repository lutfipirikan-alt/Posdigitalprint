<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sani Print — POS & Manajemen Percetakan</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#15181d" />
    <meta name="description" content="Point of Sale dan manajemen bisnis percetakan digital Sani Print" />
    <link rel="icon" href="image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='12' r='8' fill='%2300AEEF' fill-opacity='.9'/%3E%3Ccircle cx='20' cy='12' r='8' fill='%23EC008C' fill-opacity='.75'/%3E%3Ccircle cx='16' cy='19' r='8' fill='%23FFF200' fill-opacity='.75'/%3E%3Ccircle cx='16' cy='14' r='3.4' fill='%2316181D'/%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ===== Layar pembuka & pengaman boot (sebelum React aktif) ===== */
      html, body { margin: 0; background: #15181d; }
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background:
          radial-gradient(#ffffff0d 1px, transparent 1.1px) 0 0 / 18px 18px,
          #15181d;
        color: #e8eaee;
        font-family: "Space Grotesk", "Manrope", "Segoe UI", sans-serif;
        transition: opacity .35s ease;
      }
      #boot-splash.hide { opacity: 0; pointer-events: none; }
      .boot-dots { display: flex; gap: 9px; }
      .boot-dots i {
        width: 15px; height: 15px; border-radius: 50%;
        animation: bootPulse 1.15s ease-in-out infinite;
      }
      .boot-dots i:nth-child(1) { background: #00AEEF; }
      .boot-dots i:nth-child(2) { background: #EC008C; animation-delay: .14s; }
      .boot-dots i:nth-child(3) { background: #FFF200; animation-delay: .28s; }
      @keyframes bootPulse {
        0%, 100% { transform: translateY(0) scale(1); opacity: 1; }
        50% { transform: translateY(-7px) scale(.88); opacity: .7; }
      }
      .boot-name { font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
      .boot-name small { display: block; margin-top: 5px; font-size: 10.5px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: #6d7683; }
      .boot-bar { width: 168px; height: 3px; border-radius: 99px; background: #262b33; overflow: hidden; }
      .boot-bar i { display: block; height: 100%; width: 38%; border-radius: 99px; background: #1293b6; animation: bootSlide 1.1s ease-in-out infinite; }
      @keyframes bootSlide { 0% { transform: translateX(-110%); } 100% { transform: translateX(320%); } }
      #boot-error {
        display: none; position: fixed; inset: 0; z-index: 10000;
        align-items: center; justify-content: center; padding: 24px;
        background: radial-gradient(#ffffff0d 1px, transparent 1.1px) 0 0 / 18px 18px, #15181d;
        font-family: "Manrope", "Segoe UI", sans-serif; color: #e8eaee;
      }
      #boot-error .panel { width: 100%; max-width: 460px; background: #16191e; border: 1px solid #262b33; border-radius: 14px; padding: 22px; }
      #boot-error h1 { font-family: "Space Grotesk", sans-serif; font-size: 18px; margin: 0 0 8px; }
      #boot-error p { font-size: 13px; line-height: 1.55; color: #98a1ad; margin: 0 0 12px; }
      #boot-error pre { background: #0b0d10; border: 1px solid #262b33; border-radius: 9px; padding: 12px; font-size: 11px; color: #f0a8a8; white-space: pre-wrap; word-break: break-word; max-height: 150px; overflow: auto; margin: 0 0 16px; }
      #boot-error .row { display: flex; gap: 10px; }
      #boot-error button {
        flex: 1; border: 0; border-radius: 10px; padding: 11px 14px;
        font: 700 13px "Manrope", sans-serif; cursor: pointer;
      }
      #boot-error .b1 { background: #0e7490; color: #fff; }
      #boot-error .b1:hover { background: #1293b6; }
      #boot-error .b2 { background: #1b1f25; color: #e8eaee; border: 1px solid #333a44; }
      #boot-error .b2:hover { background: #232830; }
    </style>
    <script>
      /* tema + penangkap error boot */
      window.__bootErrors = [];
      window.addEventListener("error", function (e) {
        window.__bootErrors.push((e.message || "error") + " — " + (e.filename || "") + ":" + (e.lineno || ""));
      });
      window.addEventListener("unhandledrejection", function (e) {
        window.__bootErrors.push("Promise: " + String(e.reason && e.reason.message || e.reason));
      });
      try {
        var t = localStorage.getItem("sp-theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- layar pembuka: tampil sampai React berhasil dirender -->
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-dots"><i></i><i></i><i></i></div>
      <div class="boot-name">Sani Print<small>POS &middot; Percetakan</small></div>
      <div class="boot-bar"><i></i></div>
    </div>

    <!-- panel diagnostik: hanya tampil jika aplikasi gagal boot -->
    <div id="boot-error">
      <div class="panel">
        <h1>Aplikasi gagal dimuat di lingkungan ini</h1>
        <p>
          Skrip Sani Print tidak berhasil berjalan (kemungkinan cache lama atau lingkungan
          preview memblokir sesuatu). Coba muat ulang — atau bersihkan cache lalu muat ulang.
        </p>
        <pre id="boot-error-detail">Tidak ada detail error yang tertangkap.</pre>
        <div class="row">
          <button class="b1" onclick="location.reload()">Muat Ulang</button>
          <button class="b2" onclick="(async()=>{try{if(window.caches){var ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}if(window.navigator&&navigator.serviceWorker){var rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()));}}catch(e){}location.reload();})()">Bersihkan Cache</button>
        </div>
      </div>
    </div>

    <script>
      /* pengaman: jika dalam 7 detik React belum merender apa pun, tampilkan diagnostik */
      setTimeout(function () {
        var root = document.getElementById("root");
        var splash = document.getElementById("boot-splash");
        if (root && root.children.length === 0) {
          if (splash) splash.style.display = "none";
          var box = document.getElementById("boot-error");
          var detail = document.getElementById("boot-error-detail");
          if (box) box.style.display = "flex";
          if (detail && window.__bootErrors.length) {
            detail.textContent = window.__bootErrors.slice(0, 6).join("\n");
          }
        } else if (splash && root && root.children.length > 0 && root.innerHTML.length > 100) {
          /* React sudah jalan — sembunyikan splash (cadangan) */
        }
      }, 7000);
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
